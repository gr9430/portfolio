<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glenn's Walk to School, ~'07 // 9.4 miles</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  font-family: 'Courier Prime', monospace;
  color: #e8e8e8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 48px;
  /* grain overlay */
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

.wrapper {
  width: 100%;
  max-width: 860px;
}

header {
  border: 2px solid #e8e8e8;
  padding: 18px 24px 14px;
  margin-bottom: 0;
  position: relative;
  background: #0a0a0a;
}

header::after {
  content: '';
  position: absolute;
  top: 4px; left: 4px; right: -4px; bottom: -4px;
  border: 1px solid #555;
  z-index: -1;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 8px;
}

h1 {
  font-family: 'Special Elite', cursive;
  font-size: clamp(20px, 4vw, 32px);
  color: #fff;
  line-height: 1.1;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.stat-block {
  text-align: right;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #aaa;
  line-height: 1.8;
  border-left: 1px solid #444;
  padding-left: 14px;
}

.stat-block strong {
  color: #fff;
  font-size: 18px;
  display: block;
  letter-spacing: 0;
  font-family: 'Special Elite', cursive;
}

.subhead {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #777;
  border-top: 1px solid #333;
  padding-top: 8px;
}

/* map */
#map {
  width: 100%;
  height: 400px;
  border: 2px solid #e8e8e8;
  border-top: none;
  filter: grayscale(100%) contrast(1.1);
}

/* bottom panel */
.panel {
  display: grid;
  grid-template-columns: 220px 1fr;
  border: 2px solid #e8e8e8;
  border-top: none;
  min-height: 280px;
}

.loc-list-wrap {
  border-right: 1px solid #444;
  overflow-y: auto;
  max-height: 340px;
}

.loc-list-wrap h3 {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #666;
  padding: 10px 12px 6px;
  border-bottom: 1px solid #333;
}

.loc-list {
  list-style: none;
}

.loc-list li {
  padding: 8px 12px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  font-size: 11px;
  color: #bbb;
  letter-spacing: 0.5px;
  line-height: 1.4;
  transition: background 0.15s, color 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.loc-list li:hover, .loc-list li.active {
  background: #e8e8e8;
  color: #0a0a0a;
}

.loc-num {
  font-size: 9px;
  color: #555;
  min-width: 14px;
  font-family: 'Special Elite', cursive;
}

.loc-list li:hover .loc-num,
.loc-list li.active .loc-num {
  color: #333;
}

/* detail pane */
.detail-pane {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.detail-pane.empty {
  justify-content: center;
  align-items: center;
  color: #333;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
}

.detail-img-wrap {
  position: relative;
  overflow: hidden;
  border: 1px solid #333;
  /* xerox halftone-ish feel via CSS */
  image-rendering: auto;
}

.detail-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 3px
  );
  pointer-events: none;
}

.detail-img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
  filter: grayscale(100%) contrast(1.3) brightness(0.95);
}

.detail-title {
  font-family: 'Special Elite', cursive;
  font-size: 16px;
  color: #fff;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}

.detail-body {
  font-size: 12px;
  color: #aaa;
  line-height: 1.75;
}

.detail-note {
  font-size: 11px;
  color: #666;
  font-style: italic;
  border-left: 2px solid #444;
  padding-left: 10px;
  margin-top: 4px;
}

footer {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #444;
  text-align: center;
  padding-top: 8px;
}

/* Leaflet overrides */
.leaflet-popup-content-wrapper {
  background: #111 !important;
  border: 1px solid #e8e8e8 !important;
  border-radius: 0 !important;
  box-shadow: 3px 3px 0 #fff !important;
  font-family: 'Courier Prime', monospace !important;
  color: #e8e8e8 !important;
}
.leaflet-popup-tip-container { display: none; }
.leaflet-popup-content { margin: 10px 14px !important; }
.popup-name {
  font-family: 'Special Elite', cursive;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #fff;
}

.leaflet-control-zoom a {
  background: #111 !important;
  color: #e8e8e8 !important;
  border-color: #444 !important;
}

@media (max-width: 600px) {
  .panel { grid-template-columns: 1fr; }
  .loc-list-wrap { border-right: none; border-bottom: 1px solid #444; max-height: 180px; }
  .stat-block { border-left: none; padding-left: 0; }
}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="header-top">
      <div>
        <h1>Glenn's Walk to School</h1>
      </div>
      <div class="stat-block">
        <strong>9.4 mi</strong>

      </div>
    </div>
    <div class="subhead">Orlando, FL &nbsp;&bull;&nbsp; ~2007 &nbsp;&bull;&nbsp; Age 13 &nbsp;&bull;&nbsp; Howard Middle School</div>
  </header>

  <div id="map"></div>

  <div class="panel">
    <div class="loc-list-wrap">

    </div>
    <div class="detail-pane empty" id="detail-pane">
      &mdash; select a location &mdash;
    </div>
  </div>

  <footer>Exercise 4: Maps &nbsp;&bull;&nbsp; Texts &amp; Technology PhD &nbsp;&bull;&nbsp; UCF &nbsp;&bull;&nbsp; Google Street View imagery</footer>
</div>

const routeCoords = [
  [28.56141,-81.31307],[28.56112,-81.31603],[28.56068,-81.31707],
  [28.55977,-81.31790],[28.55487,-81.31999],[28.55410,-81.32077],
  [28.55384,-81.32198],[28.55360,-81.32312],[28.55330,-81.35232],
  [28.55118,-81.35227],[28.55112,-81.35955],[28.55301,-81.36012],
  [28.55299,-81.36038],[28.54590,-81.36030],[28.54585,-81.36842],
  [28.54556,-81.36843],[28.54559,-81.36986],[28.54571,-81.36987],
  [28.54569,-81.36694]
];

// Init map
const map = L.map('map', {
  center: [28.5535, -81.340],
  zoom: 13
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

L.polyline(routeCoords, {
  color: '#ffffff',
  weight: 2.5,
  opacity: 0.7,
  dashArray: '5, 5'
}).addTo(map);

function makeIcon(active) {
  return L.divIcon({
    className: '',
    html: `<svg width="16" height="24" viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 0C3.6 0 0 3.6 0 8c0 6 8 16 8 16s8-10 8-16C16 3.6 12.4 0 8 0z" fill="${active ? '#ffffff' : '#e8e8e8'}" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="8" cy="8" r="3" fill="#0a0a0a"/>
    </svg>`,
    iconSize: [16, 24],
    iconAnchor: [8, 24],
    popupAnchor: [0, -26]
  });
}

const listEl = document.getElementById('loc-list');
const detailEl = document.getElementById('detail-pane');
let activeIndex = null;
const listItems = [];
const markers = [];

function showDetail(idx) {
  const loc = locations[idx];
  // Update list
  listItems.forEach((li, i) => li.classList.toggle('active', i === idx));
  activeIndex = idx;
  // Update detail
  const imgSrc = IMGS[loc.id] || '';
  detailEl.classList.remove('empty');
  detailEl.innerHTML = `
    ${imgSrc ? `<div class="detail-img-wrap"><img class="detail-img" src="${imgSrc}" alt="${loc.name}"/></div>` : ''}
    <div class="detail-title">${loc.name}</div>
    <div class="detail-body">${loc.description}${loc.note ? `<div class="detail-note">${loc.note}</div>` : ''}</div>
  `;
}

locations.forEach((loc, i) => {
  const marker = L.marker(loc.coords, { icon: makeIcon(false) })
    .addTo(map)
    .bindPopup(`<div class="popup-name">${loc.name}</div>`, { maxWidth: 180 });

  marker.on('click', () => {
    showDetail(i);
    map.setView(loc.coords, 15, { animate: true });
  });
  markers.push(marker);

  const li = document.createElement('li');
  li.innerHTML = `<span class="loc-num">${String(i+1).padStart(2,'0')}</span>${loc.name}`;
  li.addEventListener('click', () => {
    map.setView(loc.coords, 15, { animate: true });
    markers[i].openPopup();
    showDetail(i);
  });
  listEl.appendChild(li);
  listItems.push(li);
});
</script>
</body>
</html>
