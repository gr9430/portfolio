<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
<body>
<header class="site-header">
  <div class="wrapper">
    <h1 class="animated-header thermal-text" id="site-title">Glenn S. Ritchey III</h1>

    <div class="cv-navigation">
      <ul>
        <li class="nav-dropdown-container">
          <button class="nav-dropdown-btn animated-link" id="cvs-dropdown-btn">
            CVs
            <span class="dropdown-arrow">▼</span>
          </button>
          <div class="nav-dropdown" id="cvs-dropdown">
            <a href="{{ site.baseurl }}/academic/" class="nav-option">Academic</a>
            <a href="{{ site.baseurl }}/creative/" class="nav-option">Creative</a>
            <a href="#" class="nav-option" id="complete-cv-option">Complete</a>
          </div>
        </li>
        <li><a href="{{ site.baseurl }}/blog/" class="animated-link">Blog</a></li>
        <li class="nav-dropdown-container">
          <button class="nav-dropdown-btn animated-link" id="teaching-dropdown-btn">
            Teaching
            <span class="dropdown-arrow">▼</span>
          </button>
          <div class="nav-dropdown" id="teaching-dropdown">
            <a href="{{ site.baseurl }}/teaching/statement/" class="nav-option">Teaching Statement</a>
            <a href="{{ site.baseurl }}/teaching/syllabi/" class="nav-option">Syllabi</a>
            <a href="{{ site.baseurl }}/teaching/zines/" class="nav-option">Zine Library</a>
          </div>
        </li>
      </ul>
    </div>
  </div>
</header>
<main class="page-content" aria-label="Content">
<div class="wrapper">
        {{ content }}
</div>
</main>
    {%- include footer.html -%}

<!-- Floating Action Buttons -->
<div class="floating-buttons">
  <div class="floating-btn-container email-dropdown-container">
    <button class="floating-btn email-btn" id="email-dropdown-btn" title="Email me">
      <span class="btn-icon">✉</span>
      <span class="dropdown-arrow">▼</span>
    </button>
    <div class="email-dropdown" id="email-dropdown">
      <a href="mailto:glenn.ritchey@ucf.edu" class="email-option">Professional</a>
      <a href="mailto:glenn@limb.fun" class="email-option">Creative</a>
    </div>
  </div>

  <div class="floating-btn-container cv-dropdown-container">
    <button class="floating-btn cv-btn" id="cv-dropdown-btn" title="Download CV">
      <span class="btn-icon">CV</span>
      <span class="dropdown-arrow">▼</span>
    </button>
    <div class="cv-dropdown" id="cv-dropdown">
      <a href="/cvs/ritchey-academic-cv.pdf" class="cv-option" target="_blank">Academic CV</a>
      <a href="/cvs/ritchey-creative-cv.pdf" class="cv-option" target="_blank">Creative CV</a>
    </div>
  </div>
</div>

<button id="scrollToTop" style="
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: rgb(122, 6, 97);
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 1000;
    " title="Back to top">↑</button>
    
    <script>
      window.onscroll = function() {
        var button = document.getElementById("scrollToTop");
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
          button.style.display = "block";
        } else {
          button.style.display = "none";
        }
      };
      document.getElementById("scrollToTop").onclick = function() {
        window.scrollTo({top: 0, behavior: 'smooth'});
      };

      // Make site title clickable after thermal printing animation completes
      document.addEventListener('DOMContentLoaded', function() {
        var siteTitle = document.getElementById('site-title');
        if (siteTitle) {
          // Wait for the animation to complete (2s thermal-print duration)
          setTimeout(function() {
            siteTitle.style.cursor = 'pointer';
            siteTitle.classList.add('clickable-title');
            siteTitle.onclick = function() {
              window.location.href = '{{ site.baseurl }}/';
            };
          }, 2000); // Match the 2s animation duration
        }
      });

      // Floating buttons functionality
      // Email dropdown
      const emailDropdownBtn = document.getElementById('email-dropdown-btn');
      const emailDropdown = document.getElementById('email-dropdown');

      if (emailDropdownBtn && emailDropdown) {
        emailDropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          emailDropdown.classList.toggle('show');
          // Close CV dropdown if open
          const cvDropdown = document.getElementById('cv-dropdown');
          if (cvDropdown) {
            cvDropdown.classList.remove('show');
          }
        });
      }

      // CV dropdown
      const cvDropdownBtn = document.getElementById('cv-dropdown-btn');
      const cvDropdown = document.getElementById('cv-dropdown');

      if (cvDropdownBtn && cvDropdown) {
        cvDropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          cvDropdown.classList.toggle('show');
          // Close email dropdown if open
          if (emailDropdown) {
            emailDropdown.classList.remove('show');
          }
        });
      }

      // CVs nav dropdown
      const cvsDropdownBtn = document.getElementById('cvs-dropdown-btn');
      const cvsDropdown = document.getElementById('cvs-dropdown');
      const completeCvOption = document.getElementById('complete-cv-option');

      if (cvsDropdownBtn && cvsDropdown) {
        cvsDropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          cvsDropdown.classList.toggle('show');
          // Close other dropdowns if open
          if (emailDropdown) {
            emailDropdown.classList.remove('show');
          }
          if (cvDropdown) {
            cvDropdown.classList.remove('show');
          }
          if (teachingDropdown) {
            teachingDropdown.classList.remove('show');
          }
        });
      }

      // Complete CV option triggers blended view
      if (completeCvOption) {
        completeCvOption.addEventListener('click', function(e) {
          e.preventDefault();
          renderBlendedView('navigation');
          cvsDropdown.classList.remove('show');
        });
      }

      // Teaching nav dropdown
      const teachingDropdownBtn = document.getElementById('teaching-dropdown-btn');
      const teachingDropdown = document.getElementById('teaching-dropdown');

      if (teachingDropdownBtn && teachingDropdown) {
        teachingDropdownBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          teachingDropdown.classList.toggle('show');
          // Close other dropdowns if open
          if (emailDropdown) {
            emailDropdown.classList.remove('show');
          }
          if (cvDropdown) {
            cvDropdown.classList.remove('show');
          }
          if (cvsDropdown) {
            cvsDropdown.classList.remove('show');
          }
        });
      }

      // Close dropdowns when clicking outside
      document.addEventListener('click', function(e) {
        // Close email dropdown if clicking outside
        if (emailDropdownBtn && emailDropdown &&
            !emailDropdownBtn.contains(e.target) && !emailDropdown.contains(e.target)) {
          emailDropdown.classList.remove('show');
        }

        // Close floating CV dropdown if clicking outside
        if (cvDropdownBtn && cvDropdown &&
            !cvDropdownBtn.contains(e.target) && !cvDropdown.contains(e.target)) {
          cvDropdown.classList.remove('show');
        }

        // Close CVs nav dropdown if clicking outside
        if (cvsDropdownBtn && cvsDropdown &&
            !cvsDropdownBtn.contains(e.target) && !cvsDropdown.contains(e.target)) {
          cvsDropdown.classList.remove('show');
        }

        // Close teaching nav dropdown if clicking outside
        if (teachingDropdownBtn && teachingDropdown &&
            !teachingDropdownBtn.contains(e.target) && !teachingDropdown.contains(e.target)) {
          teachingDropdown.classList.remove('show');
        }
      });
    </script>

    <!-- CV Blender functionality -->
    <script src="{{ site.baseurl }}/assets/js/cv-blender.js"></script>
</body>
</html>
