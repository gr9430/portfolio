<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting a Still Bird — Page</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #e8e8e8;
  font-family: 'Special Elite', serif;
  color: #0a0a0a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 48px;
}

.wrapper {
  width: 100%;
  max-width: 700px;
}

header {
  border: 2px solid #0a0a0a;
  padding: 18px 24px 14px;
  margin-bottom: 32px;
  position: relative;
  background: #e8e8e8;
}

header::after {
  content: '';
  position: absolute;
  top: 4px; left: 4px; right: -4px; bottom: -4px;
  border: 1px solid #555;
  z-index: -1;
}

h1 {
  font-size: 1.1rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.subtitle {
  font-size: 0.75rem;
  color: #888;
  margin-top: 4px;
  letter-spacing: 0.05em;
}

.page {
  width: 100%;
  border: 1px solid #aaa;
  background: #f5f0e8;
  padding: 8% 8%;
  min-height: 480px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 0;
}

.line {
  font-size: 1rem;
  line-height: 1.9;
  color: rgba(30, 20, 10, 0.85);
}

.reload {
  margin-top: 16px;
  background: none;
  border: 1px solid #555;
  color: #555;
  font-family: 'Special Elite', serif;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 16px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}

.reload:hover {
  border-color: #0a0a0a;
  color: #0a0a0a;
}
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>Shooting a Still Bird</h1>
    <p class="subtitle">tracery — generated page // 2–15 lines</p>
  </header>

  <div class="page" id="page"></div>

  <button class="reload" onclick="generate()">Next page</button>
</div>

<script>
// Tracery grammar inline — no fetch required
const grammarData = {
    "origin": ["#noun_room# #verb_fails# #preposition# the #noun_anchor# of the #noun_material#",
        "the #noun_structure# #verb_participle# into the #noun_surface#, #adverb_duration#",
        "#numeral# #noun_unit#: #noun_abstract#",
        "#noun_fluid# seeps from the #noun_source# #verb_participle# into the #noun_material#",
        "#adjective_sensory# #noun_substance# #verb_contact# #adjective_surface# #noun_covering#",
        "the #noun_room# is #adjective_state#, #adverb_duration#",
        "#noun_body_plural# which are #adjective_damage#",
        "the #noun_container# of the #noun_contained# is responsible",
        "the #noun_object_adjective# #noun_object_head# is responsible",
        "#noun_abstract# is but a #adjective_duration# #noun_abstract_2#",
        "#verb_imperative# your #adjective_lateral# #noun_body#—a #noun_appositive#—#preposition# the #noun_surface#",
        "#noun_material#: the #noun_structure# #verb_fails# to the #noun_anchor# of the #noun_room#",
        "a #noun_fluid# gathers #numeral# #noun_unit# before you"
    ],
    "noun_room": ["foyer","vestibule","lobby","study","hallway","manor","antechamber","chamber"],
    "noun_structure": ["staircase","balustrade","frame","facade","molding","threshold","aperture","balusters"],
    "noun_material": ["limestone","marble","silk","cotton","iron","velvet","dirt","fabric"],
    "noun_body": ["foot","eye","hand","shoulder","jaw","heel","finger","limb","torso","hide"],
    "adjective_lateral": ["left","right"],
    "noun_body_plural": ["teeth","linens","bones","limbs","phalanxes","knuckles","ribs","fingers"],
    "adjective_damage": ["chipped","matted","slashed","punctured","scabbed","fractured","unformed","depreciated"],
    "adjective_state": ["ambiguous","unreliable","unknown","concealed","static","unearthed","forbidden","saturated"],
    "adverb_duration": ["indefinitely","perpetually","presently","irreversibly","temporarily","conditionally"],
    "noun_abstract": ["existence","comfort","prestige","sanctity","altruism","opulence","artifice","farce","devotion","agency"],
    "adjective_duration": ["fleeting","lingering","unexpected","diminishing","provisional","deferred"],
    "noun_abstract_2": ["memory","tactic","arrangement","condition","fixture","inheritance","conclusion","posture"],
    "verb_imperative": ["drop","place","rest","lower","fix","press"],
    "noun_appositive": ["relic","weight","monument","remnant","instrument","liability","fixture","deposit"],
    "preposition": ["onto","into","against","toward","upon","across"],
    "noun_surface": ["dirt","limestone","foundation","molding","threshold","facade","floor","surface"],
    "noun_fluid": ["water","light","silt","blood","sepia","aroma","residue"],
    "noun_source": ["pipe","labyrinth","aperture","fissures","frame","wall","staircase","threshold"],
    "verb_participle": ["fractured","destroyed","concealed","suspended","blasted","connected","saturated","severed","forbidden"],
    "numeral": ["sixty","three","sixteen","eight","twelve"],
    "noun_unit": ["feet","yards","inches","points","corners"],
    "noun_container": ["coat","engineering","surface","design","foundation","weight","structure","residue"],
    "noun_contained": ["arms","shirt","room","staircase","foyer","manor","fabric","frame"],
    "noun_object_head": ["arms","slogan","wallpaper","graphic","baluster","trophy","fabric","molding"],
    "noun_object_adjective": ["millefleur","freestanding","tri-colored","counterfeit","floral","naive","deliberate"],
    "adjective_sensory": ["salty","flowery","cold","dripping","humid","sepia","reverb-saturated"],
    "noun_substance": ["air","light","droplets","aroma","residue","atmosphere"],
    "verb_contact": ["busses","saturates","decorates","occupies","consumes","stains","arrests","fills"],
    "adjective_surface": ["scabbed","chipped","fractured","cold","matted","depreciated","saturated"],
    "noun_covering": ["hide","surface","facade","linens","fabric","molding","threshold"],
    "verb_fails": ["buckles","surrenders","seeps","splinters","collapses"],
    "noun_anchor": ["foundation","foyer","ground","dirt","base","floor"]
};

// Simple Tracery-compatible expander (no external dependency)
function expand(grammar, symbol) {
    const options = grammar[symbol];
    if (!options) return symbol;
    const template = options[Math.floor(Math.random() * options.length)];
    return template.replace(/#([^#]+)#/g, (_, s) => expand(grammar, s));
}

function generate() {
    const page  = document.getElementById("page");
    const count = Math.floor(Math.random() * 14) + 2; // 2–15
    page.innerHTML = "";
    for (let i = 0; i < count; i++) {
        const p = document.createElement("p");
        p.className = "line";
        p.textContent = expand(grammarData, "origin");
        page.appendChild(p);
    }
}

generate();
</script>

</body>
</html>
